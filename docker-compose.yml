version: '3.8'

services:
  
  mysql:
    image: mysql:8.0
    container_name: project-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  
      MYSQL_DATABASE: "gestion_des_salles"  
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181      
      ZOOKEEPER_TICK_TIME: 2000       
    ports:
      - "2181:2181"

 
  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

 
  auth-service:
    build: ./auth-service
    ports:
      - "3000:3000"
    volumes:
      - ./auth-service/.env:/app/.env
    environment:
      HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  reservation-service:
    build: ./reservation-service
    ports:
      - "3001:3001"
    volumes:
      - ./reservation-service/.env:/app/.env
    environment:
      HOST: mysql
    depends_on:
      - mysql
      - kafka  

  salles-service:
    build: ./salles-service
    ports:
      - "3002:3002"
    volumes:
      - ./salles-service/.env:/app/.env
    environment:
      HOST: mysql
    depends_on:
      - mysql
      - kafka

volumes:
  mysql_data:
