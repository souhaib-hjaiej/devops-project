apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reservation-service-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: reservation.yourdomain.com  # Replace with your domain or subdomain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: reservation-service
            port:
              number: 8081
