apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salles-service-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: salles.yourdomain.com  # Replace with your domain or subdomain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: salles-service
            port:
              number: 8080
